name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python3 scripts/validate_repo.py
      - name: Run deterministic skill evaluations
        run: python3 scripts/run_skill_evals.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
